# ---- JVM ----
# 建议在**用户级**配置里锁定 JDK（$GRADLE_USER_HOME/gradle.properties），例如：
#   org.gradle.java.home=/path/to/jdk-21
# 不要写在本文件里 —— 绝对路径一旦入库，别的机器 clone 后会因路径不存在而直接构建失败。
# 本项目开发环境曾同时装有 JDK 17/21/25，而 PATH 里的 java 是 25、AGP 对 25 支持不明确，
# 因此确实需要锁定 JDK 21（AGP 最低要求 JDK 17）。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# ---- 应用版本 ----
# ★ 两个 APK 的版本号**只在这里维护**（:app-host 与 :app-accessory 都读这两行）。
#   改版本 = 改这里，两端同时生效，不会出现"宿主 0.2.0 / 配件 0.1.0"这种错配。
#   versionCode 必须单调递增（Android 用它判断能否覆盖安装）。
#   ⚠️ 打 tag 时记得与 versionName 对齐；CI 只认 `v` 开头的 tag（如 v0.2.0）。
usbscreen.versionName=0.3.0
usbscreen.versionCode=3

# ---- 构建性能 ----
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ---- AndroidX ----
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Kotlin ----
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
