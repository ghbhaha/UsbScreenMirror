name: CI

# 触发：
#   - 推到 develop / master
#   - PR 目标为这两条分支
#   - 手动（Actions 页面 Run workflow）
#   - 打 v* 标签 → 额外把 APK 附到 GitHub Release
on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

# 同一分支上的新推送取消旧任务：文档改一次推一次时不必等两份
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 打 tag 时要创建 Release

jobs:
  build:
    name: 单测 + 打 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 项目 target 是 Java 17，但开发机锁的是 JDK 21，CI 跟随 21 以免两边行为不一致
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ⚠️ 必须显式覆盖 packages —— action 默认装 `tools platform-tools`，
      #    而 legacy `tools` 包已被 Google 从 SDK 仓库移除（2026-09-15 起），
      #    新版 cmdline-tools 下 sdkmanager 会直接 exit 1：
      #      Warning: Failed to find package 'tools'
      #    上游 issue：android-actions/setup-android#537。
      #    我们只需要它设置 ANDROID_HOME 并接受 license，platform 与 build-tools 下面自己装。
      #    若上游再出类似问题：整步删掉即可 —— runner 镜像本来就带
      #    /usr/local/lib/android/sdk（含 cmdline-tools），ANDROID_HOME 也已设好。
      - name: 安装 Android SDK 工具
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # compileSdk=36 + buildToolsVersion=36.0.0 是写死的；runner 自带的不一定够新，
      # 显式装一次（已存在会直接跳过，不会重复下载）
      - name: 安装 SDK Platform 36 与 Build-Tools 36.0.0
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # wrapper 指向腾讯云镜像（本地开发快）；runner 在海外，走官方源更稳。
      # 只改 CI 这次检出，仓库里的文件不动。
      - name: 临时切回官方 Gradle 发行源
        run: |
          sed -i 's#mirrors\.cloud\.tencent\.com/gradle/#services.gradle.org/distributions/#' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # 缓存 Gradle 依赖 + wrapper 发行包（wrapper 走腾讯云镜像，首次下载最耗时）
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      # ---- release 签名（可选）----
      # Gradle 从 `$GRADLE_USER_HOME/gradle.properties` 读 `usbscreen.release.*`，
      # 本机就是这样配的（密钥在 ~/.android、口令在用户级 properties，都不入库）。
      # CI 上没有那个文件，所以这里把 4 个 secret 落成同样的属性：
      #   1) KEYSTORE_BASE64  → 解码成 $RUNNER_TEMP/release.jks
      #   2) 其余 3 个 secret → 写进 ~/.gradle/gradle.properties
      # 没配 secret 时整步跳过，release 仍产出 unsigned，**不会让 CI 变红**。
      # 生成 base64：base64 -w0 ~/.android/usbscreen-release.jks
      - name: 准备 release 签名
        id: signing
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::notice::未配置 KEYSTORE_BASE64 —— release 产物将是不签名的"
            exit 0
          fi
          mkdir -p "$HOME/.gradle"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "usbscreen.release.storeFile=$RUNNER_TEMP/release.jks"
            echo "usbscreen.release.storePassword=$KS_PASS"
            echo "usbscreen.release.keyAlias=$KEY_ALIAS"
            echo "usbscreen.release.keyPassword=$KEY_PASS"
          } >> "$HOME/.gradle/gradle.properties"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "::notice::release 签名配置已就绪"

      # 唯一能在没有真机时真正验收的部分；失败就不要再打包了
      - name: 协议层单测
        run: ./gradlew :protocol:test --stacktrace

      # 只打 release：debug 与 release 现在共用同一张证书，release 包能直接装，
      # 没必要再产一份带调试入口的 debug 包（编译验证 release 同样覆盖，且多跑一道 lintVital）。
      # 有签名配置时产物是 *-release.apk；没有则是 *-release-unsigned.apk（装不上，仅作构建验证）
      - name: 构建 release APK
        run: ./gradlew :app-host:assembleRelease :app-accessory:assembleRelease --stacktrace

      # 测试报告无论成败都传，失败时靠它定位
      - name: 上传单测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test-report
          path: protocol/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 14

      # 没配签名时这里是 *-release-unsigned.apk —— 仍然上传，方便排查"为什么装不上"
      - name: 上传 release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app-host/build/outputs/apk/release/*.apk
            app-accessory/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 只在推 v* 标签、且签名就绪时创建 Release —— 没签名的是 unsigned 包，
      # 挂上去只会让人装失败，不如干脆不发。
      # （注意 tag 必须是 `v` 开头：`0.1.0` 这种纯版本号不会触发本工作流）
      - name: 发布 Release（仅 tag 且签名就绪）
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-host/build/outputs/apk/release/app-host-release.apk
            app-accessory/build/outputs/apk/release/app-accessory-release.apk
          generate_release_notes: true
          body: |
            ### 附件说明

            | 文件 | 装到哪 |
            | --- | --- |
            | `app-host-release.apk` | **宿主**（那台要显示画面的安卓设备） |
            | `app-accessory-release.apk` | **被投屏的安卓设备**（手机 / 平板 / 盒子 / 车机） |

            两个包都由本仓库私有密钥签名，**版本号相同、必须成对升级**
            （协议里有只在握手时协商一次的行为，一端用旧包会静默不生效）。

            安装：

            ```bash
            adb install -r app-host-release.apk        # 宿主
            adb install -r app-accessory-release.apk   # 被投屏端
            ```

            > 若设备上装的是早期 debug 证书的包，第一次需先 `adb uninstall`（iOS 配对记录会丢，
            > iPad 上要重新点一次「信任」）；之后 debug 与 release 可互相覆盖。

            配对 iPad、adb 调试入口等用法见 README 与 `docs/快速开始.md`。
